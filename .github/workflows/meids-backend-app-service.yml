name: Deploy Me.IDs backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/meids-backend-app-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: meids-backend-app-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Validate backend contract
        run: npm run check:backend

      - name: Prepare deploy package
        shell: bash
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package/scripts
          cp -R backend package.json package-lock.json deploy-package/
          cp scripts/bootstrap-production-postgres.cjs scripts/run-postgres-migrations.cjs deploy-package/scripts/
          cd deploy-package
          npm ci --omit=dev
          zip -r ../meids-backend.zip .

      - name: Deploy backend
        shell: bash
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path meids-backend.zip \
            --type zip \
            --restart true \
            --track-status true \
            --output none

      - name: Verify App Service state
        shell: bash
        run: |
          test "$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query state -o tsv)" = "Running"

      - name: Show backend URL
        run: |
          echo "MEIDS_BACKEND_URL=https://${AZURE_WEBAPP_NAME}.azurewebsites.net" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment uses GitHub OIDC; no publish-profile secret is stored in GitHub." >> "$GITHUB_STEP_SUMMARY"

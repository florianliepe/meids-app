name: Me.IDs pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meids-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Me.IDs pull request validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: meids-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Validate build identity
        run: node --test scripts/test-build-info.cjs

      - name: Validate frontend JavaScript
        run: node --check frontend/api.js && node --check frontend/app.js && node --check frontend/admin/admin.js

      - name: Validate backend contracts
        run: npm run check:backend

      - name: Validate Azure-native agent adapter
        run: npm run check:azure-native-agents

      - name: Validate approval transaction races on PostgreSQL
        env:
          PGPASSWORD: meids-test-only
          MEIDS_TEST_RUN_ID: ${{ github.run_id }}
          MEIDS_ALLOW_DESTRUCTIVE_TEST_DB: "1"
          MEIDS_TEST_DATABASE_URL: postgresql://postgres:meids-test-only@127.0.0.1:5432/meids_approval_race_${{ github.run_id }}_test
        run: |
          createdb -h 127.0.0.1 -U postgres "meids_approval_race_${GITHUB_RUN_ID}_test"
          npm run test:approval-race

      - name: Validate approval recovery after process termination
        env:
          PGPASSWORD: meids-test-only
          MEIDS_TEST_RUN_ID: ${{ github.run_id }}
          MEIDS_ALLOW_DESTRUCTIVE_TEST_DB: "1"
          MEIDS_TEST_DATABASE_URL: postgresql://postgres:meids-test-only@127.0.0.1:5432/meids_approval_crash_${{ github.run_id }}_test
        run: |
          createdb -h 127.0.0.1 -U postgres "meids_approval_crash_${GITHUB_RUN_ID}_test"
          npm run test:approval-process-termination

      - name: Validate agent contracts
        run: npm run check:agents

      - name: Validate API parity
        run: npm run check:api-parity

      - name: Validate knowledge access
        run: npm run check:knowledge-access

      - name: Validate Entra onboarding
        run: npm run check:entra-onboarding

      - name: Validate Admin Cockpit
        run: npm run check:admin-cockpit

      - name: Validate graph contracts
        run: |
          node scripts/validate-graph-explorer-v2.cjs
          node scripts/validate-postgres-graph-schema.cjs
          node scripts/validate-graph-promotions.cjs
          node scripts/validate-graph-persistence-contract.cjs
          node scripts/test-graph-persistence.cjs

      - name: Smoke-build static frontend
        run: node scripts/build-pages-static.cjs --output dist-pr-validation --clean --smoke

name: Deploy MeIDs frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "contracts/n8n/**"
      - "contracts/okf/**"
      - "docs/**"
      - "prompts/**"
      - "workflows/n8n/**"
      - "scripts/build-pages-static.cjs"
      - "scripts/pages-smoke-check.cjs"
      - "scripts/validate-n8n-fixtures.cjs"
      - "scripts/validate-n8n-ai-agent-workflows.cjs"
      - "scripts/validate-agent-runtime-handoffs.cjs"
      - "scripts/probe-n8n-browser-runtime-shape.cjs"
      - "scripts/validate-chat-live-n8n-uat.cjs"
      - "scripts/validate-okf-fixtures.cjs"
      - "scripts/validate-graph-promotions.cjs"
      - "scripts/validate-vector-adapter.cjs"
      - "scripts/validate-postgres-graph-schema.cjs"
      - "scripts/write-n8n-runtime-readiness-status.cjs"
      - "scripts/write-pages-agent-runtime-config.cjs"
      - ".github/workflows/intellectual-twin-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate n8n contract fixtures
        run: node scripts/validate-n8n-fixtures.cjs

      - name: Validate n8n AI-agent workflow exports
        run: node scripts/validate-n8n-ai-agent-workflows.cjs

      - name: Validate agent runtime handoff fixtures
        run: node scripts/validate-agent-runtime-handoffs.cjs

      - name: Validate n8n browser runtime shape artifact
        run: node scripts/probe-n8n-browser-runtime-shape.cjs --check

      - name: Validate Chat live n8n UAT artifact
        run: node scripts/validate-chat-live-n8n-uat.cjs

      - name: Validate OKF contract fixtures
        run: node scripts/validate-okf-fixtures.cjs

      - name: Validate graph promotion fixtures
        run: node scripts/validate-graph-promotions.cjs

      - name: Validate vector adapter fixtures
        run: node scripts/validate-vector-adapter.cjs

      - name: Validate Postgres graph projection schema
        run: node scripts/validate-postgres-graph-schema.cjs

      - name: Prepare static artifact
        env:
          GH_PAGES_VOICE_TRANSCRIPTION_URL: ${{ secrets.GH_PAGES_VOICE_TRANSCRIPTION_URL }}
          GH_PAGES_N8N_VOICE_TRANSCRIPTION_WEBHOOK_URL: ${{ secrets.GH_PAGES_N8N_VOICE_TRANSCRIPTION_WEBHOOK_URL }}
        run: node scripts/build-pages-static.cjs --output dist-pages --clean --smoke

      - name: Smoke check static artifact
        continue-on-error: true
        run: node scripts/pages-smoke-check.cjs dist-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

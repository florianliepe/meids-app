name: Deploy MeIDs frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "contracts/n8n/**"
      - "contracts/okf/**"
      - "docs/**"
      - "prompts/**"
      - "workflows/n8n/**"
      - "scripts/build-pages-static.cjs"
      - "scripts/pages-smoke-check.cjs"
      - "scripts/validate-n8n-fixtures.cjs"
      - "scripts/validate-n8n-ai-agent-workflows.cjs"
      - "scripts/validate-agent-runtime-handoffs.cjs"
      - "scripts/probe-n8n-browser-runtime-shape.cjs"
      - "scripts/validate-chat-live-n8n-uat.cjs"
      - "scripts/validate-okf-fixtures.cjs"
      - "scripts/validate-graph-promotions.cjs"
      - "scripts/validate-vector-adapter.cjs"
      - "scripts/validate-postgres-graph-schema.cjs"
      - "scripts/write-n8n-runtime-readiness-status.cjs"
      - "scripts/write-pages-agent-runtime-config.cjs"
      - ".github/workflows/intellectual-twin-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Validate n8n contract fixtures
        run: node scripts/validate-n8n-fixtures.cjs

      - name: Validate n8n AI-agent workflow exports
        run: node scripts/validate-n8n-ai-agent-workflows.cjs

      - name: Validate agent runtime handoff fixtures
        run: node scripts/validate-agent-runtime-handoffs.cjs

      - name: Validate n8n browser runtime shape artifact
        run: node scripts/probe-n8n-browser-runtime-shape.cjs --check

      - name: Validate Chat live n8n UAT artifact
        run: node scripts/validate-chat-live-n8n-uat.cjs

      - name: Validate OKF contract fixtures
        run: node scripts/validate-okf-fixtures.cjs

      - name: Validate graph promotion fixtures
        run: node scripts/validate-graph-promotions.cjs

      - name: Validate vector adapter fixtures
        run: node scripts/validate-vector-adapter.cjs

      - name: Validate Postgres graph projection schema
        run: node scripts/validate-postgres-graph-schema.cjs

      - name: Prepare static artifact
        # GitHub Pages is a public static artifact. Keep runtime config public-safe:
        # Actor Twin uses the checked-in embedded n8n chat URL; Knowledge Fabric
        # and Agentic Butler run as internal Actor Twin workflow tools.
        # Hosted backend deployments can inject secrets separately.
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages
          cp -R frontend/. dist-pages/
          cat > dist-pages/runtime-config.js <<'EOF'
          window.INTELLECTUAL_TWIN_CONFIG = {
            apiBaseUrl: "",
            assetBaseUrl: "",
            orchestrationMode: "actor_twin_embedded_chat",
            n8nChatWebhookUrl: "https://eraneos-agentic-platform.azurewebsites.net/webhook/b4afb251-2ad1-43da-9d7c-6f6473fbd3db/chat",
            n8nActorTwinWebhookUrl: "https://eraneos-agentic-platform.azurewebsites.net/webhook/b4afb251-2ad1-43da-9d7c-6f6473fbd3db/chat",
            n8nKnowledgeFabricWebhookUrl: "",
            n8nAgenticButlerWebhookUrl: "",
            n8nAgentWebhooks: {
              actor_twin: "https://eraneos-agentic-platform.azurewebsites.net/webhook/b4afb251-2ad1-43da-9d7c-6f6473fbd3db/chat",
              knowledge_fabric_agent: "",
              agentic_butler: ""
            },
            n8nAgentProbeSlots: {
              actor_twin: {
                status: "configured",
                probe_boundary: "GitHub Pages uses the embedded n8n Actor Twin chat entrypoint.",
                next_action: "Run Actor Twin UAT and capture n8n trace evidence."
              },
              knowledge_fabric_agent: {
                status: "internal_tool_via_actor_twin",
                probe_boundary: "Knowledge Fabric Agent is called by Actor Twin inside n8n through a workflow tool. A direct public Pages URL is optional.",
                next_action: "Verify the Actor Twin n8n workflow has the Knowledge Fabric workflow tool connected and published."
              },
              agentic_butler: {
                status: "internal_tool_via_actor_twin",
                probe_boundary: "Agentic Butler is called by Actor Twin inside n8n through a workflow tool. A direct public Pages URL is optional.",
                next_action: "Verify the Actor Twin n8n workflow has the Agentic Butler workflow tool connected and published."
              }
            },
            n8nChatEnabled: true,
            staticPagesMode: true
          };
          EOF
          mkdir -p dist-pages/assets/n8n-live-probes
          cp -R contracts/n8n/live-probes/. dist-pages/assets/n8n-live-probes/
          node scripts/write-pages-agent-runtime-config.cjs --output dist-pages/assets/agent-runtime-config.json
          node scripts/write-n8n-runtime-readiness-status.cjs --config dist-pages/assets/agent-runtime-config.json --output dist-pages/assets/n8n-runtime-readiness-status.json

      - name: Smoke check static artifact
        run: node scripts/pages-smoke-check.cjs dist-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

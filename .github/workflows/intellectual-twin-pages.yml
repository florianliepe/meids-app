name: Deploy MeIDs frontend to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/intellectual-twin-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

      - name: Prepare static artifact
        env:
          GH_PAGES_API_BASE_URL: ${{ secrets.GH_PAGES_API_BASE_URL }}
          GH_PAGES_N8N_CHAT_WEBHOOK_URL: ${{ secrets.GH_PAGES_N8N_CHAT_WEBHOOK_URL }}
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages
          cp -R frontend/. dist-pages/
          cat > dist-pages/runtime-config.js <<EOF
          window.INTELLECTUAL_TWIN_CONFIG = {
            apiBaseUrl: "$GH_PAGES_API_BASE_URL",
            assetBaseUrl: "",
            n8nChatWebhookUrl: "$GH_PAGES_N8N_CHAT_WEBHOOK_URL",
            n8nChatEnabled: "$GH_PAGES_N8N_CHAT_WEBHOOK_URL" !== "",
            staticPagesMode: "$GH_PAGES_API_BASE_URL" === ""
          };
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
